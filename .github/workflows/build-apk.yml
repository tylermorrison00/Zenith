name: Build Zenith Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Official Zenith App Icons
        run: |
          pip install Pillow || pip3 install Pillow --break-system-packages || true
          python3 scripts/generate-icons.py

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/Zenith.apk
          ls -la release-apk/Zenith.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Android-APK
          path: release-apk/Zenith.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create android-v1.0.2 release-apk/Zenith.apk \
            --title "Zenith Android v1.0.2" \
            --notes "Zenith Android Mobile Update: Native mobile bottom navigation, responsive mobile layout, official Zenith icon, in-app updates, and theme polish. Download Zenith.apk to update." || \
          gh release upload android-v1.0.2 release-apk/Zenith.apk --clobber
