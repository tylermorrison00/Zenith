name: Build Zenith Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build

      - name: Upload Web Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Web-Dist
          path: dist

      - name: Archive Web Dist
        run: |
          mkdir -p release-apk
          cd dist && zip -r ../release-apk/Zenith-Web-Dist.zip . && cd ..

      - name: Setup Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Setup Persistent Signing Keystore & Gradle Config
        run: |
          python3 scripts/setup-signing.py "1.0.8" 10008
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keystore/zenith.keystore || true
          git commit -m "chore: persist android signing keystore [skip ci]" || true
          git push origin main || true

      - name: Generate Official Zenith App Icons
        run: |
          pip install Pillow || pip3 install Pillow --break-system-packages || true
          python3 scripts/generate-icons.py

      - name: Setup Native In-App Updater Plugin
        run: |
          python3 scripts/setup-updater-plugin.py

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p release-apk
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" release-apk/Zenith.apk
          ls -la release-apk/Zenith.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith-Android-APK
          path: release-apk/Zenith.apk

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.8 release-apk/Zenith.apk release-apk/Zenith-Web-Dist.zip \
            --title "Zenith v1.0.8" \
            --notes "Zenith Update: Habits placed first in Today's flow before tasks. Available for mobile (APK) and laptop." || \
          gh release upload v1.0.8 release-apk/Zenith.apk release-apk/Zenith-Web-Dist.zip --clobber
          gh release upload android-v1.0.8 release-apk/Zenith.apk release-apk/Zenith-Web-Dist.zip --clobber || true

  build-windows:
    name: Build Windows Setup
    runs-on: windows-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build

      - name: Pack Windows Executable
        run: npm run pack

      - name: Publish Windows Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem -Path release -Filter "Zenith*Setup*.exe" | Select-Object -First 1
          if ($installer) {
            $destName = "Zenith.Setup.1.0.8.exe"
            Copy-Item $installer.FullName -Destination "release/$destName"
            gh release upload v1.0.8 "release/$destName" --repo tylermorrison00/Zenith --clobber
            gh release upload android-v1.0.8 "release/$destName" --repo tylermorrison00/Zenith --clobber
          }
