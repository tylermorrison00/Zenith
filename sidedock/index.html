<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zenith Side Dock</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .dock::-webkit-scrollbar, #toolView::-webkit-scrollbar, .tool-list::-webkit-scrollbar, #railTools::-webkit-scrollbar, #panelTodoList::-webkit-scrollbar, #panelNotesList::-webkit-scrollbar, #panelDoneList::-webkit-scrollbar, #panelHabitList::-webkit-scrollbar { display: none; width: 0; height: 0; }
  .dock, #toolView, .tool-list, #railTools, #panelTodoList, #panelNotesList, #panelDoneList, #panelHabitList { scrollbar-width: none; -ms-overflow-style: none; }
  textarea::-webkit-scrollbar, input::-webkit-scrollbar { display: none; width: 0; height: 0; }
  textarea { scrollbar-width: none; -ms-overflow-style: none; }

  :root {
    --bg: #070606;
    --panel: #121110;
    --panel2: #1a1817;
    --line: rgba(226, 217, 208, 0.08);
    --line-strong: rgba(226, 217, 208, 0.16);
    --text: #E2D9D0;
    --muted: #858079;
    --dim: #55514c;
    --accent: #22E33E;
    --accent-rgb: 34, 227, 62;
    --accent-glow: rgba(34, 227, 62, 0.35);
  }

  body[data-theme='amber'] {
    --accent: #D69B51;
    --accent-rgb: 214, 155, 81;
    --accent-glow: rgba(214, 155, 81, 0.35);
  }
  body[data-theme='green'] {
    --accent: #22E33E;
    --accent-rgb: 34, 227, 62;
    --accent-glow: rgba(34, 227, 62, 0.35);
  }
  body[data-theme='yellow'] {
    --accent: #E3C021;
    --accent-rgb: 227, 192, 33;
    --accent-glow: rgba(227, 192, 33, 0.35);
  }
  body[data-theme='blue'] {
    --accent: #216AE2;
    --accent-rgb: 33, 106, 226;
    --accent-glow: rgba(33, 106, 226, 0.35);
  }
  body[data-theme='purple'] {
    --accent: #8521E2;
    --accent-rgb: 133, 33, 226;
    --accent-glow: rgba(133, 33, 226, 0.35);
  }

  html, body { height: 100%; width: 100%; }
  body {
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow: hidden;
    user-select: none;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    letter-spacing: -0.01em;
  }

  #rail {
    overflow: visible;
    width: 56px;
    height: 100%;
    flex: 0 0 56px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.05), transparent 70%), linear-gradient(180deg, #161514 0%, #090808 100%);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1), opacity .3s ease;
  }
  #rail .logo {
    width: 34px;
    height: 34px;
    flex: 0 0 34px;
    border-radius: 10px;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    cursor: pointer;
    transition: transform 0.2s;
  }
  #rail .logo:hover {
    transform: scale(1.08);
  }
  #rail .logo img {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }
  #railTools {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    flex: 1;
    overflow: visible;
    width: 100%;
  }
  #railTools .tool {
    width: 36px;
    height: 36px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 11px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    color: var(--text);
    cursor: pointer;
    position: relative;
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #railTools .tool:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 255, 255, 0.2);
    transform: scale(1.06);
  }
  #railTools .tool.active {
    background: rgba(var(--accent-rgb), 0.16);
    border-color: var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  #railTools .tool img {
    width: 22px;
    height: 22px;
    object-fit: contain;
  }
  #railTools .tool .icon-text {
    font-size: 17px;
  }
  #rail .settings-btn {
    width: 36px;
    height: 36px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--line);
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    position: relative;
    transition: all 0.2s ease;
  }
  #rail .settings-btn:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.2);
  }

  /* Tooltips */
  #rail .tool:hover::after,
  #rail .settings-btn:hover::after {
    content: attr(data-name);
    position: absolute;
    right: calc(100% + 12px);
    top: 50%;
    transform: translateY(-50%);
    z-index: 999;
    background: #141312;
    border: 1px solid var(--line-strong);
    color: #ffffff;
    padding: 6px 12px;
    border-radius: 9px;
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    pointer-events: none;
  }
  body.panel-open #rail .tool:hover::after,
  body.panel-open #rail .settings-btn:hover::after {
    display: none !important;
  }

  /* Expanded Panel */
  .dock {
    height: 100%;
    width: 300px;
    flex: 0 0 300px;
    padding: 16px 14px;
    display: none;
    flex-direction: column;
    gap: 12px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.04), transparent 70%), linear-gradient(180deg, #141312 0%, #0a0909 100%);
    border: 1px solid var(--line);
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    overflow-x: hidden;
    overflow-y: auto;
    position: relative;
  }
  body.panel-open .dock {
    display: flex !important;
  }

  /* Auto-hide states */
  body.hidden #rail {
    transform: translateX(120%);
    opacity: 0;
    pointer-events: none;
  }
  #arrowTab {
    display: none;
    width: 24px;
    height: 64px;
    background: #121110;
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 12px 0 0 12px;
    color: var(--accent);
    font-size: 14px;
    font-weight: 800;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    transition: background 0.2s, transform 0.2s;
  }
  #arrowTab:hover {
    background: #1c1a19;
    transform: translateY(-50%) scale(1.05);
  }
  body.hidden.arrow-only #arrowTab {
    display: grid !important;
  }

  /* Dock Topbar */
  .dock-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--line);
    -webkit-app-region: drag;
  }
  .dock-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .dock-brand-logo {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: rgba(var(--accent-rgb), 0.12);
    border: 1px solid rgba(var(--accent-rgb), 0.25);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .dock-brand-logo img {
    width: 18px;
    height: 18px;
    object-fit: contain;
  }
  .dock-brand-name {
    font-size: 13.5px;
    font-weight: 600;
    color: #ffffff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dock-close-btn {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    color: var(--muted);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 13px;
    transition: all 0.15s ease;
    -webkit-app-region: no-drag;
  }
  .dock-close-btn:hover {
    color: #ffffff;
    background: rgba(255, 255, 255, 0.08);
  }

  /* Form and Inputs */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 32px;
    padding: 6px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.18s ease;
  }
  .btn:hover {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.18);
  }
  .btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #070606;
    font-weight: 700;
    box-shadow: 0 2px 10px var(--accent-glow);
  }
  .btn.primary:hover {
    filter: brightness(1.1);
  }
  input, textarea, select {
    width: 100%;
    padding: 8px 11px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    outline: none;
    font-size: 12px;
    font-family: inherit;
    transition: border-color 0.18s ease;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }

  /* Task row styling */
  .task-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border-radius: 10px;
    background: var(--panel2);
    border: 1px solid var(--line);
    transition: border-color 0.18s;
  }
  .task-row:hover {
    border-color: rgba(255, 255, 255, 0.14);
  }
  .task-cb {
    width: 20px;
    height: 20px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    padding: 0;
    transition: all 0.15s ease;
  }
  .task-cb.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 800;
    font-size: 13px;
  }
  .task-text {
    flex: 1;
    font-size: 12.5px;
    word-break: break-word;
    color: var(--text);
  }
  .task-text.done {
    text-decoration: line-through;
    opacity: 0.5;
  }
  .action-btn {
    background: transparent;
    border: 0;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    color: var(--muted);
    transition: color 0.15s;
  }
  .action-btn:hover {
    color: var(--text);
  }
  .action-btn img {
    width: 15px;
    height: 15px;
    opacity: 0.7;
    object-fit: contain;
  }
  .action-btn:hover img {
    opacity: 1;
  }

  /* Card styling for Notes & Habits */
  .item-card {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--panel2);
    border: 1px solid var(--line);
  }
  .item-card:hover {
    border-color: rgba(255, 255, 255, 0.14);
  }

  /* Night Light toggle */
  .nl-toggle {
    width: 44px;
    height: 24px;
    border-radius: 12px;
    background: var(--panel2);
    border: 1px solid var(--line);
    position: relative;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }
  .nl-toggle .knob {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .nl-toggle.on {
    background: var(--accent);
    border-color: var(--accent);
  }
  .nl-toggle.on .knob {
    transform: translateX(20px);
  }

  /* Range sliders */
  input[type=range] {
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Settings row */
  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 6px 0;
  }
  .settings-row label {
    font-size: 12px;
    color: var(--text);
  }
  .toggle-pill {
    min-width: 46px;
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel2);
    color: var(--text);
    cursor: pointer;
    font-size: 11px;
    font-weight: 700;
  }
  .toggle-pill.on {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(var(--accent-rgb), 0.12);
  }
</style>
</head>
<body data-theme="amber">
<div id="arrowTab">◀</div>

<!-- Expanded Tool / Settings Panel -->
<div class="dock">
  <div class="dock-topbar">
    <div class="dock-brand">
      <div class="dock-brand-logo">
        <img id="dockLogoImg" src="assets/zenith-logo-amber.png" alt="Zenith">
      </div>
      <div class="dock-brand-name" id="dockTitle">Zenith Dock</div>
    </div>
    <button class="dock-close-btn" id="closePanelBtn" title="Close panel">✕</button>
  </div>

  <!-- Settings View -->
  <div id="settingsPanel" style="display:none; flex-direction:column; gap:10px;">
    <div style="font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); letter-spacing:0.06em;">Dock Preferences</div>
    <div class="settings-row">
      <label>Auto-start with Windows</label>
      <button class="toggle-pill" id="autoBtn">On</button>
    </div>
    <div class="settings-row">
      <label>Auto-hide edge dock</label>
      <button class="toggle-pill" id="autohideBtn">Off</button>
    </div>

    <div style="margin-top:12px; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--muted); letter-spacing:0.06em;">Add Custom Tool</div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <input id="fName" placeholder="Tool name (e.g. Linear)">
      <input id="fIcon" placeholder="Icon / emoji (e.g. 🎯)" maxlength="4">
      <select id="fKind"><option value="url">Website link</option><option value="app">App / Command</option></select>
      <input id="fTarget" placeholder="https://... or C:\...">
      <button class="btn primary" id="saveTool">Save Tool</button>
    </div>
  </div>

  <!-- Tool Views Container -->
  <div id="toolView" style="display:none; flex-direction:column; gap:12px; flex:1;">
    <!-- Tasks UI -->
    <div id="panelTodoUI" style="display:none; flex-direction:column; gap:10px; flex:1;">
      <div style="display:flex; gap:6px;">
        <input id="panelTodoInput" placeholder="Add a new task...">
        <button class="btn primary" id="panelAddBtn" style="padding:6px 14px;">Add</button>
      </div>
      <div id="panelTodoList" style="display:flex; flex-direction:column; gap:6px;"></div>
      <div id="panelDoneBox" style="display:none; margin-top:auto;">
        <button id="panelDoneHeader" style="width:100%; display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:9px; background:var(--panel2); border:1px solid var(--line); color:var(--muted); cursor:pointer; font-size:12px; font-weight:600;">
          <span id="panelDoneTitle">✓ Completed</span>
          <span id="panelDoneArrow" style="transition:transform .2s;">▼</span>
        </button>
        <div id="panelDoneList" style="display:none; flex-direction:column; gap:6px; margin-top:6px;"></div>
      </div>
    </div>

    <!-- Notes UI -->
    <div id="panelNotesUI" style="display:none; flex-direction:column; gap:10px; flex:1;">
      <input id="panelNoteTitle" placeholder="Note title...">
      <textarea id="panelNoteInput" placeholder="Write your note..." style="min-height:90px;"></textarea>
      <button class="btn primary" id="panelAddNoteBtn" style="align-self:flex-start;">Add note</button>
      <div id="panelNotesList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <!-- Habits UI -->
    <div id="panelHabitUI" style="display:none; flex-direction:column; gap:10px; flex:1;">
      <div style="display:flex; gap:6px;">
        <input id="panelHabitInput" placeholder="Add daily habit...">
        <button class="btn primary" id="panelAddHabitBtn" style="padding:6px 14px;">Add</button>
      </div>
      <div id="panelHabitList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <!-- Brightness & Display UI -->
    <div id="panelBrightnessUI" style="display:none; flex-direction:column; gap:14px; flex:1;">
      <div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:6px;">
          <span>Extra Dim</span><span id="panelExtraDimValue" style="color:var(--accent);">0%</span>
        </div>
        <input id="panelExtraDimSlider" type="range" min="0" max="80" value="0">
        <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--muted); margin-top:3px;">
          <span>Standard</span><span>Dim overlay</span>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-top:1px solid var(--line);">
        <span style="font-size:12.5px; font-weight:600;">Night Light</span>
        <button class="nl-toggle" id="panelNightLightToggle"><span class="knob"></span></button>
      </div>

      <div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:6px;">
          <span>Warmth</span><span id="panelWarmValue" style="color:var(--accent);">0%</span>
        </div>
        <input id="panelWarmSlider" type="range" min="0" max="100" value="0">
      </div>
    </div>

    <!-- External Tool Launch UI -->
    <div id="panelToolOpen" style="display:none; flex-direction:column; gap:12px;">
      <div id="panelToolDesc" style="font-size:12px; color:var(--muted); word-break:break-all;"></div>
      <button class="btn primary" id="panelOpenToolBtn">Open Tool</button>
    </div>
  </div>
</div>

<!-- Right Edge Rail -->
<div id="rail">
  <div class="logo" id="railLogoBtn" title="Zenith Overview">
    <img id="railLogoImg" src="assets/zenith-logo-amber.png" alt="Zenith">
  </div>
  <div id="railTools"></div>
  <button class="settings-btn" id="railSettingsBtn" title="Settings" data-name="Settings">⚙</button>
</div>

<script>
  let panelOpen = false;
  let autoStart = true;
  let autoHide = false;
  let currentTheme = 'amber';
  let tools = [];
  let currentTool = null;
  let doneOpen = false;

  const THEME_LOGOS = {
    green: 'assets/zenith-logo-green.png',
    amber: 'assets/zenith-logo-amber.png',
    yellow: 'assets/zenith-logo-yellow.png',
    blue: 'assets/zenith-logo-blue.png',
    purple: 'assets/zenith-logo-purple.png',
  };

  function updateThemeUI(theme) {
    if (!theme) return;
    currentTheme = theme;
    document.body.dataset.theme = theme;
    const logoSrc = THEME_LOGOS[theme] || THEME_LOGOS.amber;
    document.getElementById('railLogoImg').src = logoSrc;
    document.getElementById('dockLogoImg').src = logoSrc;
  }

  async function openPanel() {
    if (!panelOpen) {
      panelOpen = await window.sideDock.setPanel(true);
      document.body.classList.add('panel-open');
      try { await window.sideDock.setMouseEvents(false); } catch {}
    }
  }

  async function closePanel() {
    panelOpen = await window.sideDock.setPanel(false);
    document.body.classList.remove('panel-open');
    currentTool = null;
    document.querySelectorAll('#railTools .tool').forEach(t => t.classList.remove('active'));
    try { await window.sideDock.setMouseEvents(true); } catch {}
  }

  function showToolView(tool) {
    currentTool = tool;
    document.body.classList.add('panel-open');
    document.getElementById('settingsPanel').style.display = 'none';
    document.getElementById('toolView').style.display = 'flex';
    document.getElementById('dockTitle').textContent = tool.name;

    document.querySelectorAll('#railTools .tool').forEach(el => {
      el.classList.toggle('active', el.dataset.id === tool.id);
    });

    // Hide all tool subviews first
    document.getElementById('panelTodoUI').style.display = 'none';
    document.getElementById('panelNotesUI').style.display = 'none';
    document.getElementById('panelHabitUI').style.display = 'none';
    document.getElementById('panelBrightnessUI').style.display = 'none';
    document.getElementById('panelToolOpen').style.display = 'none';

    if (tool.id === 'todo-list' || tool.target === 'todo') {
      document.getElementById('panelTodoUI').style.display = 'flex';
      renderTodos();
    } else if (tool.id === 'notes' || tool.target === 'notes') {
      document.getElementById('panelNotesUI').style.display = 'flex';
      renderNotes();
    } else if (tool.id === 'habit-tracker' || tool.target === 'habit') {
      document.getElementById('panelHabitUI').style.display = 'flex';
      renderHabits();
    } else if (tool.id === 'brightness-control' || tool.target === 'brightness') {
      document.getElementById('panelBrightnessUI').style.display = 'flex';
      loadBrightnessUI();
    } else {
      document.getElementById('panelToolOpen').style.display = 'flex';
      document.getElementById('panelToolDesc').textContent = tool.target || '';
    }
  }

  function showSettingsView() {
    currentTool = null;
    document.body.classList.add('panel-open');
    document.getElementById('toolView').style.display = 'none';
    document.getElementById('settingsPanel').style.display = 'flex';
    document.getElementById('dockTitle').textContent = 'Dock Settings';
    document.querySelectorAll('#railTools .tool').forEach(el => el.classList.remove('active'));
  }

  function renderRail() {
    const railTools = document.getElementById('railTools');
    railTools.innerHTML = '';
    tools.forEach(tool => {
      const btn = document.createElement('button');
      btn.className = 'tool' + (currentTool && currentTool.id === tool.id ? ' active' : '');
      btn.dataset.name = tool.name;
      btn.dataset.id = tool.id;

      if (tool.logo || tool.iconAccent) {
        const iconPath = 'assets/' + (tool.iconAccent || tool.logo);
        btn.innerHTML = `<img src="${iconPath}" alt="${tool.name}">`;
      } else {
        btn.innerHTML = `<span class="icon-text">${tool.icon || '◆'}</span>`;
      }

      btn.addEventListener('click', async () => {
        if (panelOpen && currentTool && currentTool.id === tool.id) {
          await closePanel();
        } else {
          await openPanel();
          showToolView(tool);
        }
      });
      railTools.appendChild(btn);
    });
  }

  // Tasks Rendering
  async function renderTodos() {
    const todos = await window.sideDock.getTodos();
    const active = (todos || []).filter(t => !t.done);
    const done = (todos || []).filter(t => t.done);
    const listEl = document.getElementById('panelTodoList');
    listEl.innerHTML = '';

    if (!active.length) {
      listEl.innerHTML = `<div style="text-align:center; color:var(--muted); padding:20px 8px; font-size:12px;">${done.length ? 'All tasks complete.' : 'No tasks yet. Add one above.'}</div>`;
    }

    active.forEach(task => {
      const div = document.createElement('div');
      div.className = 'task-row';

      const cb = document.createElement('button');
      cb.className = 'task-cb' + (task.done ? ' done' : '');
      cb.innerHTML = task.done ? '✓' : '';
      cb.addEventListener('click', async () => {
        await window.sideDock.toggleTodo(task.id);
        renderTodos();
      });

      const span = document.createElement('span');
      span.className = 'task-text';
      span.textContent = task.text || task.title;

      const del = document.createElement('button');
      del.className = 'action-btn';
      del.title = 'Delete task';
      del.innerHTML = '<img src="assets/action-bin.png" alt="Del">';
      del.addEventListener('click', async () => {
        await window.sideDock.deleteTodo(task.id);
        renderTodos();
      });

      div.append(cb, span, del);
      listEl.appendChild(div);
    });

    // Completed Box
    const doneBox = document.getElementById('panelDoneBox');
    const doneList = document.getElementById('panelDoneList');
    const doneTitle = document.getElementById('panelDoneTitle');
    const doneArrow = document.getElementById('panelDoneArrow');

    if (!done.length) {
      doneBox.style.display = 'none';
      doneList.style.display = 'none';
      return;
    }

    doneBox.style.display = 'block';
    doneTitle.textContent = `✓ Completed (${done.length})`;
    doneArrow.style.transform = doneOpen ? 'rotate(180deg)' : 'rotate(0deg)';
    doneList.style.display = doneOpen ? 'flex' : 'none';
    doneList.innerHTML = '';

    done.forEach(task => {
      const div = document.createElement('div');
      div.className = 'task-row';

      const cb = document.createElement('button');
      cb.className = 'task-cb done';
      cb.innerHTML = '✓';
      cb.addEventListener('click', async () => {
        await window.sideDock.toggleTodo(task.id);
        renderTodos();
      });

      const span = document.createElement('span');
      span.className = 'task-text done';
      span.textContent = task.text || task.title;

      const del = document.createElement('button');
      del.className = 'action-btn';
      del.innerHTML = '<img src="assets/action-bin.png" alt="Del">';
      del.addEventListener('click', async () => {
        await window.sideDock.deleteTodo(task.id);
        renderTodos();
      });

      div.append(cb, span, del);
      doneList.appendChild(div);
    });
  }

  // Notes Rendering
  async function renderNotes() {
    const notes = await window.sideDock.getNotes();
    const listEl = document.getElementById('panelNotesList');
    listEl.innerHTML = '';

    if (!notes || !notes.length) {
      listEl.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px 8px; font-size:12px;">No notes yet. Create one above.</div>';
      return;
    }

    notes.forEach(note => {
      const card = document.createElement('div');
      card.className = 'item-card';

      const titleEl = document.createElement('div');
      titleEl.style.cssText = 'font-size:13px; font-weight:600; color:#fff; word-break:break-word;';
      titleEl.textContent = note.title || 'Untitled note';

      const bodyEl = document.createElement('div');
      bodyEl.style.cssText = 'font-size:12px; color:var(--muted); word-break:break-word; white-space:pre-wrap; line-height:1.4;';
      bodyEl.textContent = note.text || note.body || note.excerpt || '';

      const actions = document.createElement('div');
      actions.style.cssText = 'display:flex; gap:8px; align-items:center; margin-top:2px;';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-btn';
      copyBtn.title = 'Copy text';
      copyBtn.innerHTML = '<img src="assets/action-copy.png" alt="Copy">';
      copyBtn.addEventListener('click', async () => {
        await window.sideDock.copyNote(bodyEl.textContent);
        copyBtn.style.color = 'var(--accent)';
        setTimeout(() => { copyBtn.style.color = ''; }, 1000);
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'action-btn';
      delBtn.title = 'Delete note';
      delBtn.innerHTML = '<img src="assets/action-bin.png" alt="Del">';
      delBtn.addEventListener('click', async () => {
        await window.sideDock.deleteNote(note.id);
        renderNotes();
      });

      actions.append(copyBtn, delBtn);
      card.append(titleEl, bodyEl, actions);
      listEl.appendChild(card);
    });
  }

  // Habits Rendering
  async function renderHabits() {
    const habits = await window.sideDock.getHabits();
    const listEl = document.getElementById('panelHabitList');
    listEl.innerHTML = '';

    if (!habits || !habits.length) {
      listEl.innerHTML = '<div style="text-align:center; color:var(--muted); padding:20px 8px; font-size:12px;">No habits yet. Add one above.</div>';
      return;
    }

    habits.forEach(habit => {
      const card = document.createElement('div');
      card.className = 'item-card';

      const row = document.createElement('div');
      row.style.cssText = 'display:flex; align-items:center; gap:9px;';

      const cb = document.createElement('button');
      cb.className = 'task-cb' + (habit.done ? ' done' : '');
      cb.innerHTML = habit.done ? '✓' : '';
      cb.addEventListener('click', async () => {
        await window.sideDock.toggleHabit(habit.id);
        renderHabits();
      });

      const nameEl = document.createElement('div');
      nameEl.style.cssText = 'flex:1; font-size:13px; font-weight:600; color:#fff;';
      nameEl.textContent = habit.title || habit.name;

      const streakEl = document.createElement('div');
      streakEl.style.cssText = 'font-size:11px; font-weight:600; color:var(--accent); white-space:nowrap;';
      streakEl.textContent = (habit.streak || 0) + 'd streak';

      const delBtn = document.createElement('button');
      delBtn.className = 'action-btn';
      delBtn.innerHTML = '<img src="assets/action-bin.png" alt="Del">';
      delBtn.addEventListener('click', async () => {
        await window.sideDock.deleteHabit(habit.id);
        renderHabits();
      });

      row.append(cb, nameEl, streakEl, delBtn);

      // Dots history
      const dots = document.createElement('div');
      dots.style.cssText = 'display:grid; grid-template-columns:repeat(14, 1fr); gap:3px; margin-top:4px;';
      const history = habit.history || [];
      for (let i = 0; i < 14; i++) {
        const dot = document.createElement('span');
        const isDone = history[history.length - 14 + i] || (i === 13 && habit.done);
        dot.style.cssText = `height:7px; border-radius:2px; background:${isDone ? 'var(--accent)' : 'rgba(255,255,255,0.06)'}; display:block;`;
        dots.appendChild(dot);
      }

      card.append(row, dots);
      listEl.appendChild(card);
    });
  }

  // Brightness UI
  async function loadBrightnessUI() {
    try {
      const ex = await window.sideDock.getExtraDim();
      if (ex) {
        document.getElementById('panelExtraDimSlider').value = ex.level;
        document.getElementById('panelExtraDimValue').textContent = ex.level + '%';
      }
      const nl = await window.sideDock.getNightLight();
      if (nl) {
        document.getElementById('panelNightLightToggle').classList.toggle('on', !!nl.on);
      }
      const warm = await window.sideDock.getWarm();
      if (warm) {
        document.getElementById('panelWarmSlider').value = warm.level;
        document.getElementById('panelWarmValue').textContent = warm.level + '%';
      }
    } catch {}
  }

  // Event Listeners
  document.getElementById('panelDoneHeader').addEventListener('click', () => {
    doneOpen = !doneOpen;
    renderTodos();
  });

  document.getElementById('panelAddBtn').addEventListener('click', async () => {
    const inp = document.getElementById('panelTodoInput');
    const text = inp.value.trim();
    if (!text) return;
    await window.sideDock.addTodo(text);
    inp.value = '';
    renderTodos();
  });

  document.getElementById('panelTodoInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('panelAddBtn').click();
  });

  document.getElementById('panelAddNoteBtn').addEventListener('click', async () => {
    const tInp = document.getElementById('panelNoteTitle');
    const bInp = document.getElementById('panelNoteInput');
    const text = bInp.value.trim();
    if (!text) return;
    await window.sideDock.addNote({ title: tInp.value.trim(), text });
    tInp.value = '';
    bInp.value = '';
    renderNotes();
  });

  document.getElementById('panelAddHabitBtn').addEventListener('click', async () => {
    const inp = document.getElementById('panelHabitInput');
    const name = inp.value.trim();
    if (!name) return;
    await window.sideDock.addHabit(name);
    inp.value = '';
    renderHabits();
  });

  document.getElementById('panelHabitInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('panelAddHabitBtn').click();
  });

  document.getElementById('panelExtraDimSlider').addEventListener('input', (e) => {
    const val = parseInt(e.target.value, 10) || 0;
    document.getElementById('panelExtraDimValue').textContent = val + '%';
    window.sideDock.setExtraDim(val);
  });

  document.getElementById('panelWarmSlider').addEventListener('input', (e) => {
    const val = parseInt(e.target.value, 10) || 0;
    document.getElementById('panelWarmValue').textContent = val + '%';
    window.sideDock.setWarm(val);
  });

  document.getElementById('panelNightLightToggle').addEventListener('click', async () => {
    const btn = document.getElementById('panelNightLightToggle');
    btn.disabled = true;
    await window.sideDock.toggleNightLight();
    const st = await window.sideDock.getNightLight();
    btn.classList.toggle('on', !!(st && st.on));
    btn.disabled = false;
  });

  document.getElementById('panelOpenToolBtn').addEventListener('click', () => {
    if (currentTool) window.sideDock.launchTool(currentTool);
  });

  document.getElementById('closePanelBtn').addEventListener('click', closePanel);

  document.getElementById('railSettingsBtn').addEventListener('click', async () => {
    if (panelOpen && !currentTool) {
      await closePanel();
    } else {
      await openPanel();
      showSettingsView();
    }
  });

  document.getElementById('autoBtn').addEventListener('click', async () => {
    autoStart = await window.sideDock.setAutostart(!autoStart);
    const b = document.getElementById('autoBtn');
    b.textContent = autoStart ? 'On' : 'Off';
    b.classList.toggle('on', autoStart);
  });

  document.getElementById('autohideBtn').addEventListener('click', async () => {
    autoHide = await window.sideDock.setAutohide(!autoHide);
    const b = document.getElementById('autohideBtn');
    b.textContent = autoHide ? 'On' : 'Off';
    b.classList.toggle('on', autoHide);
  });

  document.getElementById('arrowTab').addEventListener('click', () => {
    window.sideDock.showFromArrow();
  });
  document.getElementById('arrowTab').addEventListener('mouseenter', () => {
    window.sideDock.showFromArrow();
  });

  document.getElementById('saveTool').addEventListener('click', async () => {
    const name = document.getElementById('fName').value.trim();
    const target = document.getElementById('fTarget').value.trim();
    if (!name || !target) return;
    tools = await window.sideDock.addTool({
      name,
      target,
      icon: document.getElementById('fIcon').value.trim() || '◆',
      kind: document.getElementById('fKind').value
    });
    document.getElementById('fName').value = '';
    document.getElementById('fIcon').value = '';
    document.getElementById('fTarget').value = '';
    renderRail();
  });

  // Real-time synchronization listeners
  window.sideDock.onDataUpdated((data) => {
    if (currentTool) {
      if (currentTool.id === 'todo-list') renderTodos();
      else if (currentTool.id === 'notes') renderNotes();
      else if (currentTool.id === 'habit-tracker') renderHabits();
    }
  });

  window.sideDock.onThemeChanged((theme) => {
    updateThemeUI(theme);
  });

  window.sideDock.onAutoHideShow(() => {
    document.body.classList.remove('hidden', 'arrow-only');
  });

  window.sideDock.onAutoHideHide(() => {
    document.body.classList.add('hidden');
  });

  window.sideDock.onAutoHideArrowOnly(() => {
    document.body.classList.add('arrow-only');
  });

  // Init
  async function init() {
    const state = await window.sideDock.getState();
    if (state) {
      autoStart = state.autoStart !== false;
      autoHide = !!state.autoHide;
      currentTheme = state.theme || 'amber';
      tools = state.tools || [];
      updateThemeUI(currentTheme);

      const ab = document.getElementById('autoBtn');
      ab.textContent = autoStart ? 'On' : 'Off';
      ab.classList.toggle('on', autoStart);

      const ahb = document.getElementById('autohideBtn');
      ahb.textContent = autoHide ? 'On' : 'Off';
      ahb.classList.toggle('on', autoHide);
    }
    renderRail();
  }

  init();
  const dockEl = document.querySelector('.dock');
  const railEl = document.getElementById('rail');
  if (dockEl) {
    dockEl.addEventListener('mouseenter', () => { window.sideDock.setMouseEvents(false); });
    dockEl.addEventListener('mouseleave', () => { if (!panelOpen) window.sideDock.setMouseEvents(true); });
  }
  if (railEl) {
    railEl.addEventListener('mouseenter', () => { window.sideDock.setMouseEvents(false); });
    railEl.addEventListener('mouseleave', () => { if (!panelOpen) window.sideDock.setMouseEvents(true); });
  }
  try { window.sideDock.setMouseEvents(true); } catch {}
</script>
</body>
</html>
