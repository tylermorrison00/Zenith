<!doctype html>
<html lang="en" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#040303" />
    <meta name="description" content="Zenith — a quiet productivity workspace for protecting deep work and understanding where your time goes." />
    <link rel="icon" type="image/png" href="./zenith-logo.png" />
    <title>Zenith</title>
    <script>
      try {
        const t = localStorage.getItem('zenith-theme-v2');
        if (t) document.documentElement.dataset.theme = JSON.parse(t);
        else document.documentElement.dataset.theme = 'green';
      } catch (e) {
        document.documentElement.dataset.theme = 'green';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
